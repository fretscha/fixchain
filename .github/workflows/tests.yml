name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same branch / PR when a new commit lands.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # Linux covers bash 5 + OpenSSL 3.
        # macOS covers bash 3.2 + LibreSSL — important because the scripts
        # are explicitly written to work on macOS's stock shell.
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          uname -a
          bash --version | head -1
          openssl version

      - name: Run tests
        run: ./tests/run_all.sh
